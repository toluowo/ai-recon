# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run recon_ai in mock-only mode
        run: |
          # run against example.com without API keys, should still generate a report
          mkdir -p reports
          python recon_ai.py --domain example.com --summary --score --pretext --company "Example Inc." --output reports/example.com_report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: recon-report
          path: reports/example.com_report.md
