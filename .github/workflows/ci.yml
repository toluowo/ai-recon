name: CI

on:
  push:
    branches:
      - main
      - feature/senior-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run type checks
        run: mypy src

      - name: Run tests
        run: pytest -v

  package:
    name: Package validation

    runs-on: ubuntu-latest

    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distribution artifacts
        run: python -m build

      - name: Create clean environment
        run: python -m venv .package-test

      - name: Install wheel in clean environment
        run: |
          .package-test/bin/python -m pip install --upgrade pip
          .package-test/bin/python -m pip install dist/*.whl

      - name: Verify installed CLI
        run: .package-test/bin/ai-recon --help

      - name: Run installed package smoke test
        run: |
          .package-test/bin/ai-recon \
            --target example.com \
            --authorized \
            --format json